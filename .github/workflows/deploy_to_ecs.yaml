name: Deploy to ECS Production

on:
  push:
    branches:
      - master
      - devops

  pull_request:
    branches:
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cap at 60 min — Docker build (~6 min) + image push + manual stabilize poll (up to 30 min).
    timeout-minutes: 60

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      # Task definition and service name (with defaults if not in secrets)
      ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION || 'ck-prod-td' }}
      ECS_SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME || 'ck-prod-td-service-lggotxj9' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_URL: ${{ secrets.S3_URL}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Add swap for Docker build (prevents OOM)
        run: |
          sudo fallocate -l 4G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile 2>/dev/null || true
          sudo swapon /swapfile 2>/dev/null || true
          free -h

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Download environment file from S3
        run: |
          aws s3 cp s3://ck-prod-env/.env .env

      - name: Debug environment variables
        run: echo "ECR_REPOSITORY=${ECR_REPOSITORY}"

      - name: Build and Push Docker Image
        run: |
          echo "Building Docker image..."
          docker build \
            --progress=plain \
            -t "${ECR_REPOSITORY}:latest" . || {
            echo "❌ Docker build failed. Check the logs above for details."
            exit 1
          }
          echo "✅ Docker build successful. Tagging image..."
          docker tag "${ECR_REPOSITORY}:latest" "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest"
          echo "Pushing Docker image to ECR..."
          docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest"
          echo "✅ Image pushed successfully to ECR"

      - name: Update ECS Task Definition
        id: task-def
        run: |
          echo "📋 Fetching current task definition: ${ECS_TASK_DEFINITION}"
          
          # Fetch the current task definition (get latest revision)
          task_def=$(aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --region "${AWS_REGION}" \
            --query 'taskDefinition' \
            --output json)

          if [ -z "$task_def" ] || [ "$task_def" == "null" ]; then
            echo "❌ Failed to fetch task definition"
            exit 1
          fi

          echo "✅ Task definition fetched successfully"

          # Clean the task definition by removing unwanted fields and update image
          new_task_def=$(echo "$task_def" | jq '
            del(.status, .revision, .taskDefinitionArn, .requiresAttributes, .registeredAt, .registeredBy, .compatibilities) |
            .containerDefinitions[0].image = "'${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest'"
          ')

          # Save the cleaned task definition to a file
          echo "$new_task_def" > ecsTaskDef.json
          echo "✅ Task definition prepared"

      - name: Register Updated Task Definition
        id: register-task
        run: |
          echo "📝 Registering new task definition..."
          
          register_output=$(aws ecs register-task-definition \
            --cli-input-json file://ecsTaskDef.json \
            --region "${AWS_REGION}")
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to register task definition"
            exit 1
          fi

          # Extract the new task definition ARN
          TASK_DEF_ARN=$(echo "$register_output" | jq -r '.taskDefinition.taskDefinitionArn')
          TASK_DEF_REVISION=$(echo "$register_output" | jq -r '.taskDefinition.revision')
          
          echo "✅ Task definition registered: ${TASK_DEF_ARN}"
          echo "task-def-arn=${TASK_DEF_ARN}" >> $GITHUB_OUTPUT
          echo "task-def-revision=${TASK_DEF_REVISION}" >> $GITHUB_OUTPUT
          echo "task-def-family=${ECS_TASK_DEFINITION}" >> $GITHUB_OUTPUT

      - name: Update ECS Service to Use New Task Definition
        run: |
          echo "🚀 Updating ECS service: ${ECS_SERVICE_NAME}"
          echo "   Task Definition: ${ECS_TASK_DEFINITION}:${{ steps.register-task.outputs.task-def-revision }}"
          
          # Update service with explicit task definition. The 180s grace
          # period is critical: NestJS takes ~30s to load all modules and
          # call app.listen() — without grace, ALB health checks fail
          # immediately, the deployment circuit-breaker trips, and ECS
          # rolls back to the previous TD (this happened on TD 129).
          update_output=$(aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE_NAME}" \
            --task-definition "${ECS_TASK_DEFINITION}:${{ steps.register-task.outputs.task-def-revision }}" \
            --desired-count 4 \
            --health-check-grace-period-seconds 180 \
            --force-new-deployment \
            --region "${AWS_REGION}")
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to update ECS service"
            exit 1
          fi

          echo "✅ Service update initiated"
          echo "$update_output" | jq '{serviceName: .service.serviceName, status: .service.status, taskDefinition: .service.taskDefinition, desiredCount: .service.desiredCount}'

      - name: Wait for Service to Stabilize
        env:
          TARGET_REVISION: ${{ steps.register-task.outputs.task-def-revision }}
        run: |
          # Manual poll — `aws ecs wait services-stable` is hardcoded to
          # 40 × 15s = 10 min, which is too short for a 4-task rolling
          # deployment with health-check grace period. Poll up to 30 min and
          # log progress so we can see the rollout advance instead of just
          # waiting in silence.
          DEADLINE=$(( $(date +%s) + 30*60 ))
          echo "⏳ Polling deployment status until rolloutState=COMPLETED (up to 30 min)..."
          while true; do
            STATE_RAW=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE_NAME}" \
              --region "${AWS_REGION}" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].[rolloutState,taskDefinition,desiredCount,runningCount,pendingCount]' \
              --output text)
            STATE=$(echo "$STATE_RAW" | awk '{print $1}')
            TD=$(echo "$STATE_RAW" | awk '{print $2}')
            DESIRED=$(echo "$STATE_RAW" | awk '{print $3}')
            RUNNING=$(echo "$STATE_RAW" | awk '{print $4}')
            PENDING=$(echo "$STATE_RAW" | awk '{print $5}')

            echo "  [$(date -u +%T)] rolloutState=${STATE} td=${TD##*/} running=${RUNNING}/${DESIRED} pending=${PENDING}"

            case "$STATE" in
              COMPLETED)
                # Sanity check: PRIMARY deployment should reference the task
                # definition we just registered. If something else triggered a
                # rollback, fail loudly.
                if [[ "$TD" != *":${TARGET_REVISION}" ]]; then
                  echo "❌ PRIMARY deployment is on ${TD} but we registered :${TARGET_REVISION} — rollback or out-of-band change?"
                  exit 1
                fi
                echo "✅ Service deployment completed on ck-prod-td:${TARGET_REVISION}."
                aws ecs describe-services \
                  --cluster "${ECS_CLUSTER}" \
                  --services "${ECS_SERVICE_NAME}" \
                  --region "${AWS_REGION}" \
                  --query 'services[0].{ServiceName:serviceName,Status:status,TaskDefinition:taskDefinition,RunningCount:runningCount,DesiredCount:desiredCount}' \
                  --output json | jq .
                exit 0
                ;;
              FAILED)
                echo "❌ Deployment rolloutState=FAILED. Recent service events:"
                aws ecs describe-services \
                  --cluster "${ECS_CLUSTER}" \
                  --services "${ECS_SERVICE_NAME}" \
                  --region "${AWS_REGION}" \
                  --query 'services[0].events[0:10].[createdAt,message]' \
                  --output table || true
                exit 1
                ;;
            esac

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "❌ Timed out after 30 min waiting for rolloutState=COMPLETED."
              echo "Recent service events:"
              aws ecs describe-services \
                --cluster "${ECS_CLUSTER}" \
                --services "${ECS_SERVICE_NAME}" \
                --region "${AWS_REGION}" \
                --query 'services[0].events[0:10].[createdAt,message]' \
                --output table || true
              exit 1
            fi
            sleep 20
          done
